meta:
  environment: python
  toolchain:
    name: pip
    version: 3.9
  build:
    requirementsPath: requirements.txt
run:
  command: python manage.py migrate && python manage.py collectstatic --noinput && gunicorn kiwiweb.wsgi:application --bind 0.0.0.0:80
  persistenceMount: /data
  containerPort: 80
